name: Release

on:
    push:
        branches:
            - master

permissions:
  contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
    
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
              with:
                egress-policy: audit

            - name: Checkout code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Get next version with semver-action
              id: semver
              uses: step-security/semver-action@cdfef12f38a611b3c4ffc04f7c8018aa98ce5beb # v1.11.0
              with:
                branch: ${{ github.ref_name }}	
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Create tag
              run: |
                git tag ${{ steps.semver.outputs.next }}
                git tag ${{ steps.semver.outputs.nextMajor }}

            - name: Push tag
              run: git push --tags --force            

            - name: Create GitHub Release with gh cli
              run: gh release create ${{ steps.semver.outputs.next }} --generate-notes
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}